<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#08050e" stop-opacity="0" />
    </radialGradient>
    
    <!-- Neon Purple/Magenta Controller Gradient -->
    <linearGradient id="controllerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5179e" />
      <stop offset="50%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#3f37c9" />
    </linearGradient>

    <!-- Neon Button Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="100%" stop-color="#4895ef" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f72585" />
      <stop offset="100%" stop-color="#b5179e" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7209b7" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4cc9f0" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)" />

  <!-- Outer Rounded Square Border (Glow effect) -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="#7209b7" stroke-width="4" stroke-opacity="0.4" />
  
  <g filter="url(#neonShadow)">
    <!-- Controller Body -->
    <path d="M 120,160 
             L 392,160 
             C 440,160 480,200 480,250 
             C 480,310 420,384 370,384 
             C 340,384 320,360 256,360 
             C 192,360 172,384 142,384 
             C 92,384 32,310 32,250 
             C 32,200 72,160 120,160 Z" 
          fill="url(#controllerGrad)" 
          stroke="#9d4edd" 
          stroke-width="3" />

    <!-- Grip Inner Details -->
    <path d="M 90,190 C 70,220 70,280 90,310" fill="none" stroke="#f72585" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <path d="M 422,190 C 442,220 442,280 422,310" fill="none" stroke="#4cc9f0" stroke-width="3" stroke-linecap="round" opacity="0.7" />

    <!-- D-PAD (Left Side) -->
    <g transform="translate(120, 260)">
      <!-- D-Pad Base -->
      <rect x="-35" y="-12" width="70" height="24" rx="6" fill="#140d24" stroke="#9d4edd" stroke-width="2" />
      <rect x="-12" y="-35" width="24" height="70" rx="6" fill="#140d24" stroke="#9d4edd" stroke-width="2" />
      <circle cx="0" cy="0" r="10" fill="#241a42" />
      <!-- Arrows indicators -->
      <polygon points="0,-28 -6,-20 6,-20" fill="#4cc9f0" />
      <polygon points="0,28 -6,20 6,20" fill="#4cc9f0" />
      <polygon points="-28,0 -20,-6 -20,6" fill="#4cc9f0" />
      <polygon points="28,0 20,-6 20,6" fill="#4cc9f0" />
    </g>

    <!-- Action Buttons (Right Side) -->
    <g transform="translate(370, 260)">
      <!-- Y Button (Top) -->
      <circle cx="0" cy="-30" r="15" fill="url(#neonPink)" stroke="#ffffff" stroke-width="1.5" />
      <text x="0" y="-25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Y</text>

      <!-- A Button (Right) -->
      <circle cx="30" cy="0" r="15" fill="url(#neonCyan)" stroke="#ffffff" stroke-width="1.5" />
      <text x="30" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>

      <!-- B Button (Bottom) -->
      <circle cx="0" cy="30" r="15" fill="url(#neonPink)" stroke="#ffffff" stroke-width="1.5" />
      <text x="0" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>

      <!-- X Button (Left) -->
      <circle cx="-30" cy="0" r="15" fill="url(#neonCyan)" stroke="#ffffff" stroke-width="1.5" />
      <text x="-30" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">X</text>
    </g>

    <!-- Select & Start Buttons (Center) -->
    <g transform="translate(256, 280)">
      <!-- Select -->
      <rect x="-45" y="-6" width="30" height="12" rx="6" fill="#140d24" stroke="#9d4edd" stroke-width="2" transform="rotate(-15, -30, 0)" />
      <text x="-30" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#9d4edd" text-anchor="middle">SELECT</text>
      
      <!-- Start -->
      <rect x="15" y="-6" width="30" height="12" rx="6" fill="#140d24" stroke="#9d4edd" stroke-width="2" transform="rotate(-15, 30, 0)" />
      <text x="30" y="20" font-family="sans-serif" font-size="10" font-weight="bold" fill="#9d4edd" text-anchor="middle">START</text>
    </g>
    
    <!-- Logo Indicator (Center Top) -->
    <path d="M 236,190 L 276,190" stroke="#4cc9f0" stroke-width="4" stroke-linecap="round" />
    <circle cx="256" cy="215" r="8" fill="#f72585" />
  </g>
</svg>
